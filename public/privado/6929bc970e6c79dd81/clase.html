<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>La clase del temario · ActiveXRemote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Major+Mono+Display&display=swap">
<style>
/* Una clase entera en SVG: escenario 16:9 que avanza frase a frase con la voz, subtítulos debajo e índice de la clase. */
:root{
  --bg:#0D0C16; --ink2:#17152A; --ink3:#211E3A; --fg:#F2F1FA; --mut:#A29EBB; --dim:#615D7C;
  --pur:#5B4BF5; --pur-l:#9488FF; --red:#E4462F; --red-l:#FF7C66;
  --line:rgba(242,241,250,.13);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Major Mono Display","Courier New",monospace;
  --ease:cubic-bezier(.2,.75,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(20px,env(safe-area-inset-top,0px)) 40px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:clamp(20px,2.4vw,28px);letter-spacing:-.02em;text-wrap:balance}
.top a{color:var(--mut);font-size:14px}
.player{position:relative;border-radius:18px;overflow:hidden;background:var(--ink2);border:1px solid var(--line);box-shadow:0 30px 90px -30px rgba(91,75,245,.5)}
.stage{position:relative;aspect-ratio:16/9;width:100%;background:var(--bg);overflow:hidden}
.stage>svg{display:block;width:100%;height:100%}
.player:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0}
.player:fullscreen .stage{width:auto;height:calc(100vh - 150px);margin:0 auto}

svg text{fill:var(--fg);font-family:var(--sans)}
.disp{font-weight:800;letter-spacing:-.025em}
.semi{font-weight:600}
.mono{font-family:var(--mono)}
.mut{fill:var(--mut)} .dimt{fill:var(--dim)} .pl{fill:var(--pur-l)} .rl{fill:var(--red-l)} .ink{fill:var(--bg)}
.eyebrow{font-weight:700;letter-spacing:.18em}

/* Escenas */
.scene{opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s linear .7s}
.scene.on{opacity:1;visibility:visible;transition:opacity .7s ease}
/* Al entrar en la escena */
.scene.on .a-up{animation:up .9s var(--ease) var(--d,0s) both}
.scene.on .a-fade{animation:fade 1s ease var(--d,0s) both}
.scene.on .a-pop{animation:pop .7s cubic-bezier(.2,1.5,.4,1) var(--d,0s) both}
.scene.on .a-draw{stroke-dasharray:1;animation:draw var(--t,1.4s) cubic-bezier(.6,0,.2,1) var(--d,0s) both}
/* Al empezar la frase que les toca */
.rv:not(.in){opacity:0}
.rv.in{animation:up .8s var(--ease) var(--d,0s) both}
.rv.pop.in{animation-name:pop;animation-timing-function:cubic-bezier(.2,1.5,.4,1)}
.rv.fade.in{animation-name:fade}
.rv.gx.in{animation-name:gx}
.rv.gy.in{animation-name:gy;animation-timing-function:cubic-bezier(.2,1.25,.4,1)}
.rv.flip.in{animation-name:flip;animation-duration:1.1s}
.rv.stamp.in{animation-name:stamp;animation-duration:.7s;animation-timing-function:cubic-bezier(.2,1.6,.4,1)}
.rv.draw{stroke-dasharray:1;stroke-dashoffset:1;opacity:1}
.rv.draw.in{stroke-dashoffset:0;animation:draw var(--t,1.2s) cubic-bezier(.6,0,.2,1) var(--d,0s) both}
.rv.gather.in{opacity:1;animation:gather 1.9s cubic-bezier(.75,0,.2,1) var(--d,0s) both}
.pop,.gx,.gy,.flip,.stamp,.a-pop{transform-box:fill-box}
.pop,.stamp,.a-pop{transform-origin:center} .gx{transform-origin:0 50%} .gy{transform-origin:50% 100%} .flip{transform-origin:50% 0}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes flip{from{opacity:0;transform:scaleY(0)}}
@keyframes stamp{from{opacity:0;transform:scale(2.4) rotate(-14deg)}}
@keyframes gather{from{transform:translate(var(--x0),var(--y0))}}
.paused .scene,.paused .scene *{animation-play-state:paused!important}
.card{transition:stroke .35s,fill .35s}
.cur .card,.card.cur{stroke:var(--hl,#9488FF);stroke-width:2.5;fill:rgba(255,255,255,.09)}
.arc{opacity:.3;transition:opacity .4s,stroke-width .4s}
.arc.hot{opacity:1;stroke-width:36}
.blob{transition:opacity 1.6s ease}

/* Portada para empezar */
.start{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(13,12,22,.55),rgba(13,12,22,.88));z-index:5}
.start[hidden]{display:none}
.start-in{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:16px}
.start button{display:flex;align-items:center;gap:14px;padding:18px 30px 18px 22px;border-radius:999px;border:0;background:var(--pur);color:#fff;font:800 clamp(16px,2vw,22px)/1 var(--sans);cursor:pointer;box-shadow:0 18px 50px -10px rgba(91,75,245,.8)}
.start button:hover{background:#4632E6}
.start button svg{width:28px;height:28px;fill:#fff}
.start p{margin:0;color:var(--mut);font-size:clamp(12px,1.4vw,15px)}
.start small{color:var(--dim);font-size:12px}

/* Subtítulos */
.cc{min-height:64px;display:flex;align-items:center;justify-content:center;padding:10px 18px;background:#0A0912;border-top:1px solid var(--line);font-size:clamp(15px,1.7vw,19px);line-height:1.4;text-align:center;text-wrap:balance;color:var(--fg)}
.cc[hidden]{display:none}

/* Barra */
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--ink2);border-top:1px solid var(--line)}
.bar>button{flex:none;height:38px;min-width:38px;padding:0 9px;border-radius:10px;border:0;background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer;font:700 12px var(--sans)}
.bar>button:hover{background:rgba(255,255,255,.08)}
.bar>button[aria-pressed="false"]{color:var(--dim)}
.bar>button svg{width:20px;height:20px;fill:currentColor}
.chapters{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.segs{display:flex;gap:2px;height:6px}
.seg{position:relative;height:100%;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;cursor:pointer;border:0;padding:0;min-width:0}
.seg i{position:absolute;inset:0;width:0;background:var(--fg)}
.seg.p i{background:var(--pur-l)} .seg.r i{background:var(--red-l)}
.seg:hover{background:rgba(255,255,255,.28)}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.meta b{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis}
button:focus-visible{outline:2px solid var(--pur-l);outline-offset:2px}

/* Índice */
.index{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.index h2{grid-column:1/-1;margin:14px 0 2px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.index button{display:flex;gap:10px;align-items:baseline;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--ink2);color:var(--fg);font:500 14px/1.35 var(--sans);cursor:pointer;min-width:0}
.index button:hover{border-color:var(--pur-l)}
.index button[aria-current="true"]{background:var(--ink3);border-color:var(--fg)}
.index button span{flex:none;font:700 11px var(--sans);letter-spacing:.08em;color:var(--mut);min-width:28px}
.index button.p span{color:var(--pur-l)} .index button.r span{color:var(--red-l)}
.voicenote{margin:0;color:var(--dim);font-size:12px;text-align:center}
@media (max-width:760px){
  .bar{gap:2px;padding:8px}
  .bar>button{min-width:32px;height:34px;padding:0 6px}
  #fs{display:none}
}
@media (prefers-reduced-motion:reduce){.scene *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>

let voiceOn=true,musicOn=true,ccOn=true,esVoice=null;
const hasTTS="speechSynthesis" in window;
function pickVoice(){
  if(!hasTTS)return;const vs=speechSynthesis.getVoices();if(!vs.length)return;
  const es=vs.filter(v=>/^es[-_]ES/i.test(v.lang));
  const pref=[/Google español$/i,/Microsoft (Alvaro|Elvira).*Online/i,/Mónica|Monica/i,/Jorge/i,/Marisol/i];
  esVoice=null;for(const r of pref){esVoice=es.find(v=>r.test(v.name));if(esVoice)break}
  if(!esVoice)esVoice=es.find(v=>!v.localService)||es[0]||vs.find(v=>/^es/i.test(v.lang))||null;
  const note=document.getElementById("voicenote");
  note.textContent=DATA.audio?"":esVoice?`Voz en off: ${esVoice.name}.`:"Este navegador no tiene voz en español: la clase sigue con subtítulos.";
}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
let token=0,audioEl=new Audio(),safety=null;
function speak(g,done){
  const my=++token;let fired=false;
  const fin=()=>{if(fired||my!==token)return;fired=true;clearTimeout(safety);done()};
  const ms=(g.dur||est(g.t))*1000;
  clearTimeout(safety);
  if(voiceOn&&DATA.audio&&g.file){audioEl.src="audio/"+g.file;audioEl.onended=fin;audioEl.onerror=()=>setTimeout(fin,ms);audioEl.play().catch(()=>setTimeout(fin,ms));safety=setTimeout(fin,ms+4000);return}
  if(voiceOn&&hasTTS&&esVoice){
    const u=new SpeechSynthesisUtterance(g.t);u.voice=esVoice;u.lang=esVoice.lang;u.rate=1.04;u.pitch=1;
    u.onend=fin;u.onerror=()=>setTimeout(fin,300);
    speechSynthesis.cancel();speechSynthesis.speak(u);safety=setTimeout(fin,ms*2.2+3000);return}
  safety=setTimeout(fin,ms);
}
function hush(){token++;clearTimeout(safety);try{audioEl.pause()}catch(_){};if(hasTTS)speechSynthesis.cancel()}

let ac=null,master=null,verb=null,pads=[];
const CH=[[146.83,185,220,277.18],[123.47,146.83,185,220],[98,123.47,146.83,185],[110,138.59,164.81,220]];
const PEN=[293.66,329.63,369.99,440,493.88,587.33,659.25,739.99,880,987.77];
function initAudio(){if(ac)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C();master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
  const dl=ac.createDelay();dl.delayTime.value=.33;const fb=ac.createGain();fb.gain.value=.3;const wet=ac.createGain();wet.gain.value=.35;dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);verb=dl}
function musicLevel(){if(!ac)return;master.gain.cancelScheduledValues(ac.currentTime);master.gain.linearRampToValueAtTime(musicOn&&playing?.32:0,ac.currentTime+.6)}
function pad(ci){if(!ac)return;const now=ac.currentTime;
  pads.forEach(({o,g})=>{g.gain.cancelScheduledValues(now);g.gain.setValueAtTime(g.gain.value,now);g.gain.linearRampToValueAtTime(0,now+1.5);o.stop(now+1.6)});pads=[];
  const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=700;lp.connect(master);
  CH[ci%4].forEach((f,k)=>[-5,5].forEach(det=>{const o=ac.createOscillator();o.type=k%2?"triangle":"sawtooth";o.frequency.value=f;o.detune.value=det;const g=ac.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(.016,now+2);o.connect(g);g.connect(lp);o.start(now);pads.push({o,g})}))}
function pluck(n){if(!ac||!musicOn)return;const now=ac.currentTime,f=PEN[n%PEN.length];const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f;
  g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.12,now+.01);g.gain.exponentialRampToValueAtTime(.0008,now+.9);o.connect(g);g.connect(master);g.connect(verb);o.start(now);o.stop(now+1)}

const svg=document.getElementById("svg"),stage=document.getElementById("stage"),cc=document.getElementById("cc");
let sc=0,sg=0,playing=false,segStartAt=0,segElapsed=0,started=false;
const blobP=document.getElementById("blobP"),blobR=document.getElementById("blobR");
function enter(i){
  sc=Math.max(0,Math.min(S.length-1,i));sg=-1;

  const g=document.getElementById("s"+sc);g.querySelectorAll(".rv.in").forEach(e=>e.classList.remove("in"));g.querySelectorAll(".cur").forEach(e=>e.classList.remove("cur"));

function reveal(k){
  const s=S[sc],r=s.segs[k].r,g=document.getElementById("s"+sc);
  g.querySelectorAll(".cur").forEach(e=>e.classList.remove("cur"));
  g.querySelectorAll(`[data-r="${r}"]`).forEach(e=>{e.classList.add("in");if(/^item/.test(r))e.classList.add("cur")});

function runSeg(k){
  sg=k;reveal(k);segStartAt=performance.now();segElapsed=0;
  speak(S[sc].segs[k],()=>{if(!playing)return;
    setTimeout(()=>{if(!playing||sg!==k)return;
      if(k+1<S[sc].segs.length)runSeg(k+1);
      else setTimeout(()=>{if(!playing||sg!==k)return;if(sc+1<S.length){enter(sc+1);runSeg(0)}else{setPlaying(false);cc.textContent="Fin de la clase."}},700)},350)});
}
function setPlaying(p){

  document.getElementById("playIco").innerHTML=p?'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>':'<path d="M7 4v16l13-8z"/>';
  document.getElementById("play").setAttribute("aria-label",p?"Pausar":"Reproducir");
  musicLevel();
}
function play(){if(!started)return begin();initAudio();ac?.resume?.();setPlaying(true);if(sg<0)runSeg(0);else runSeg(sg)}
function pause(){hush();setPlaying(false)}
function jump(i){hush();enter(i);if(!started){started=true;document.getElementById("start").hidden=true;initAudio();ac?.resume?.()}setPlaying(true);runSeg(0)}
function begin(){started=true;document.getElementById("start").hidden=true;initAudio();ac?.resume?.();enter(sc);setPlaying(true);runSeg(0)}
function ui(){
  const s=S[sc];let inScene=0;for(let k=0;k<Math.max(0,sg);k++)inScene+=(s.segs[k].dur||est(s.segs[k].t))+.35;
  if(sg>=0){const cur=s.segs[sg].dur||est(s.segs[sg].t);inScene+=Math.min(cur,playing?(performance.now()-segStartAt)/1000:segElapsed)}
  fills.forEach((f,i)=>f.style.width=i<sc?"100%":i>sc?"0%":(Math.min(1,inScene/s.est)*100).toFixed(1)+"%");
  const done=S.slice(0,sc).reduce((a,x)=>a+x.est,0)+inScene;
  document.getElementById("time").textContent=`${fmt(done)} / ${fmt(total)}`;
  document.getElementById("chap").textContent=`${sc+1}/${S.length} · ${s.name}`;
  requestAnimationFrame(ui);
}
document.getElementById("go").onclick=begin;
document.getElementById("play").onclick=()=>playing?pause():play();
document.getElementById("prev").onclick=()=>jump(sg>1?sc:sc-1);
document.getElementById("next").onclick=()=>jump(sc+1);
segsEl.addEventListener("click",e=>{const b=e.target.closest(".seg");if(b)jump(+b.dataset.i)});
idx.addEventListener("click",e=>{const b=e.target.closest("button");if(b){jump(+b.dataset.i);document.getElementById("player").scrollIntoView({behavior:"smooth",block:"start"})}});
const tog=(id,get,set)=>{const b=document.getElementById(id);b.onclick=()=>{set(!get());b.setAttribute("aria-pressed",String(get()))}};
tog("voice",()=>voiceOn,v=>{voiceOn=v;if(playing){hush();runSeg(sg)}});
tog("music",()=>musicOn,v=>{musicOn=v;initAudio();musicLevel()});
tog("ccb",()=>ccOn,v=>{ccOn=v;cc.hidden=!v});
document.getElementById("fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.getElementById("player").requestFullscreen?.().catch(()=>{})}catch(_){}};
svg.addEventListener("click",e=>{const r=e.target.closest("#replay");if(r){jump(0);return}if(e.target.closest("a"))return;if(!started)return;playing?pause():play()});
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("button,a")&&(e.key===" "||e.key==="Enter"))return;
  const k=e.key.toLowerCase();
  if(k===" "){e.preventDefault();started?(playing?pause():play()):begin()}
  else if(k==="arrowright")jump(sc+1);else if(k==="arrowleft")jump(sg>1?sc:sc-1);
  else if(k==="v")document.getElementById("voice").click();else if(k==="m")document.getElementById("music").click();
  else if(k==="c")document.getElementById("ccb").click();else if(k==="f")document.getElementById("fs").click();
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&playing)pause()});
enter(0);
// Primera imagen completa aunque no se haya pulsado nada.
document.querySelectorAll("#s0 .rv").forEach(e=>e.classList.add("in"));
cc.textContent="Pulsa «Empezar la clase». Puedes saltar a cualquier semana desde el índice de abajo.";
setPlaying(false);stage.classList.remove("paused");requestAnimationFrame(ui);
window.__clase={S,jump,enter,reveal,pause};
})();
</script>
