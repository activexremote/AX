<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
*{box-sizing:border-box}
html,body{margin:0}
/* Layout: a 16:9 SVG stage that plays like a video, with a player bar under it. Single dark look by choice. */
:root{
  --bg:#0D0C16; --ink2:#17152A; --fg:#F2F1FA; --mut:#A29EBB; --dim:#615D7C;
  --pur:#5B4BF5; --pur-l:#9488FF; --red:#E4462F; --red-l:#FF7C66;
  --line:rgba(242,241,250,.13);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Major Mono Display","Courier New",monospace;
  --ease:cubic-bezier(.2,.75,.2,1);
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.player{position:relative;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 30px 80px -30px rgba(91,75,245,.45);border:1px solid var(--line)}
.stage{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;background:var(--bg);overflow:hidden}
.stage svg{display:block;width:100%;height:100%}
.player:fullscreen{display:flex;flex-direction:column;justify-content:center;border-radius:0;background:var(--bg)}
.player:fullscreen .stage{width:auto;height:calc(100vh - 64px);margin:0 auto}

/* SVG text */
svg text{fill:var(--fg);font-family:var(--sans)}
.disp{font-weight:800;letter-spacing:-.025em}
.semi{font-weight:600}
.mono{font-family:var(--mono)}
.mut{fill:var(--mut)} .dimt{fill:var(--dim)}
.pl{fill:var(--pur-l)} .rl{fill:var(--red-l)}
.eyebrow{font-weight:700;letter-spacing:.18em;font-size:19px}
.ink{fill:var(--bg)}

/* Scenes and motion */
.scene{opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
.scene.on{opacity:1;visibility:visible;transition:opacity .6s ease}
.scene.on .up{animation:up .9s var(--ease) var(--d,0s) both}
.scene.on .fade{animation:fade 1s ease var(--d,0s) both}
.scene.on .draw{animation:draw var(--t,1.4s) cubic-bezier(.6,0,.2,1) var(--d,0s) both}
.scene.on .lin{animation-timing-function:linear}
.scene.on .pop{animation:pop .7s cubic-bezier(.2,1.5,.4,1) var(--d,0s) both}
.scene.on .gx{animation:gx 1.2s var(--ease) var(--d,0s) both}
.scene.on .gy{animation:gy .8s cubic-bezier(.2,1.25,.4,1) var(--d,0s) both}
.scene.on .flip{animation:flip 1.1s cubic-bezier(.2,1.2,.3,1) var(--d,0s) both}
.scene.on .gather{animation:gather 1.9s cubic-bezier(.75,0,.2,1) var(--d,0s) both}
.scene.on .blink{animation:blink 1.8s ease-in-out var(--d,0s) infinite both}
.scene.on .swap{animation:up .55s var(--ease) both}
.draw{stroke-dasharray:1;stroke-dashoffset:0}
.pop,.gx,.gy,.flip{transform-box:fill-box}
.pop{transform-origin:center} .gx.l{transform-origin:0 50%} .gx.r{transform-origin:100% 50%}
.gy{transform-origin:50% 100%} .flip{transform-origin:50% 0}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes pop{from{opacity:0;transform:scale(.2)}}
@keyframes gx{from{transform:scaleX(0)}}
@keyframes gy{from{transform:scaleY(0)}}
@keyframes flip{from{opacity:0;transform:scaleY(0)}}
@keyframes gather{from{transform:translate(var(--x0),var(--y0))}}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
.paused .scene,.paused .scene *{animation-play-state:paused!important}

/* Interactive bits inside the stage */
.hit{cursor:pointer}
.hit:focus{outline:none}
.hit:focus-visible .ring,.hit:hover .ring{stroke-width:5;filter:drop-shadow(0 0 10px currentColor)}
.choice .card{transition:fill .3s,stroke-width .3s}
.choice:hover .card,.choice:focus-visible .card{stroke-width:4}
.choice:hover .go,.choice:focus-visible .go{text-decoration:underline}
.step .face{transition:opacity .3s,filter .3s}
.step.hot .face,.step:hover .face{filter:brightness(1.35) drop-shadow(0 0 14px rgba(255,124,102,.55))}
.arc{opacity:.32;transition:opacity .4s,stroke-width .4s}
.arc.hot{opacity:1;stroke-width:36}
.sq{transition:transform .25s}
.blob{transition:opacity 1.4s ease}

/* Overlay buttons */
.pill{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:14px;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(13,12,22,.6);backdrop-filter:blur(8px);color:var(--fg);font:600 13px/1 var(--sans);cursor:pointer}
.pill:hover{background:rgba(91,75,245,.55)}
.pill:focus-visible,.bar button:focus-visible,.seg:focus-visible,.detail button:focus-visible{outline:2px solid var(--pur-l);outline-offset:2px}

/* Player bar */
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--ink2);border-top:1px solid var(--line)}
.bar>button{flex:none;width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:var(--fg);display:grid;place-items:center;cursor:pointer}
.bar>button:hover{background:rgba(255,255,255,.08)}
.bar>button svg{width:20px;height:20px;fill:currentColor}
.chapters{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.segs{display:flex;gap:3px;height:6px}
.seg{position:relative;height:100%;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;cursor:pointer;border:0;padding:0}
.seg i{position:absolute;inset:0;width:0;background:var(--fg)}
.seg.p i{background:var(--pur-l)} .seg.r i{background:var(--red-l)}
.seg:hover{background:rgba(255,255,255,.24)}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.meta b{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis}

/* Week detail card */
.detail{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);width:min(580px,calc(100% - 32px));background:rgba(23,21,42,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:18px 20px 16px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px;animation:up .4s var(--ease) both}
.detail .tag{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.detail h3{margin:0;font-size:21px;line-height:1.2;text-wrap:balance}
.detail p{margin:0;color:var(--mut);font-size:14px;line-height:1.5}
.detail ul{margin:2px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:13.5px;line-height:1.4}
.detail li{display:flex;gap:8px}
.detail li::before{content:"";flex:none;width:6px;height:6px;margin-top:6px;border-radius:50%;background:currentColor;opacity:.7}
.detail .deel{font-size:12px;color:var(--fg);background:rgba(255,255,255,.08);border-radius:999px;padding:4px 10px;align-self:flex-start}
.detail .x{position:absolute;top:10px;right:10px;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--mut);font-size:20px;cursor:pointer}
.detail .x:hover{color:var(--fg);background:rgba(255,255,255,.08)}
.detail[hidden]{display:none}
.hint{margin:0;font-size:13px;color:var(--mut);text-align:center;text-wrap:balance}
.hint kbd{font:600 11px var(--sans);border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--fg)}
@media (max-width:760px){
  .detail{position:static;transform:none;width:auto;margin:10px;animation:none}
  .bar{gap:4px;padding:8px}
  .bar>button{width:34px;height:34px}
  #fs{display:none}
  .pill{padding:7px 10px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  .scene *,.detail{animation:none!important}
}
</style>

</head>
<body>
<div class="wrap">

    </div>

      <button class="x" id="dx" type="button" aria-label="Cerrar">×</button>
      <span class="tag" id="dTag"></span>

      <p id="dLead"></p>
      <ul id="dKeeps"></ul>

    </div>
  </div>
  <p class="hint"><a href="./" style="color:var(--mut)">← Volver a los vídeos</a> · <kbd>Espacio</kbd> pausa · <kbd>←</kbd> <kbd>→</kbd> escenas · <kbd>M</kbd> sonido · Toca una semana para ver qué te llevas</p>
</div>

/* ---------- Montaje ---------- */
const root=document.getElementById("scenes");
root.innerHTML=S.map((s,i)=>`<g class="scene" id="s${i}">${s.html}</g>`).join("");
const total=S.reduce((a,s)=>a+s.dur,0);
const segs=document.getElementById("segs");
segs.innerHTML=S.map((s,i)=>`<button class="seg ${s.mood==="p"?"p":s.mood==="r"?"r":""}" type="button" style="flex:${s.dur}" aria-label="Ir a ${esc(s.name)}" title="${esc(s.name)}" data-i="${i}"><i></i></button>`).join("");
const segFill=[...segs.querySelectorAll("i")];

/* ---------- Sonido (Web Audio, generado en el navegador) ---------- */
let ac=null,master=null,verb=null,padNodes=[],soundOn=false;
const CHORDS=[[146.83,185,220,277.18],[123.47,146.83,185,220],[98,123.47,146.83,185],[110,138.59,164.81,220]];
const PENTA=[293.66,329.63,369.99,440,493.88,587.33,659.25,739.99,880,987.77,1174.66,1318.51,1479.98,1760];
function initAudio(){
  if(ac) return;
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  ac=new C(); master=ac.createGain(); master.gain.value=0; master.connect(ac.destination);
  const dl=ac.createDelay(); dl.delayTime.value=.32; const fb=ac.createGain(); fb.gain.value=.35; const wet=ac.createGain(); wet.gain.value=.4;
  dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master); verb=dl;
}
function pad(ci){
  if(!ac||!soundOn) return;
  const now=ac.currentTime;
  padNodes.forEach(({o,g})=>{g.gain.cancelScheduledValues(now);g.gain.setValueAtTime(g.gain.value,now);g.gain.linearRampToValueAtTime(0,now+1.2);o.stop(now+1.3)});
  padNodes=[];
  const lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=800; lp.connect(master);
  CHORDS[ci%4].forEach((f,k)=>[-6,6].forEach(det=>{const o=ac.createOscillator();o.type=k%2?"triangle":"sawtooth";o.frequency.value=f;o.detune.value=det;const g=ac.createGain();g.gain.value=0;g.gain.linearRampToValueAtTime(.018,now+1.6);o.connect(g);g.connect(lp);o.start(now);padNodes.push({o,g})}));
}
function pluck(n){
  if(!ac||!soundOn) return;
  const now=ac.currentTime,f=PENTA[Math.max(0,Math.min(PENTA.length-1,n))];
  const o=ac.createOscillator(),o2=ac.createOscillator(),g=ac.createGain();
  o.type="sine";o.frequency.value=f;o2.type="triangle";o2.frequency.value=f*2;
  g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.16,now+.008);g.gain.exponentialRampToValueAtTime(.0008,now+.9);
  o.connect(g);o2.connect(g);g.connect(master);g.connect(verb);o.start(now);o2.start(now);o.stop(now+1);o2.stop(now+1);
}
function whoosh(){
  if(!ac||!soundOn) return;
  const now=ac.currentTime,len=ac.sampleRate*.8,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
  const src=ac.createBufferSource();src.buffer=buf;const bp=ac.createBiquadFilter();bp.type="bandpass";bp.Q.value=1.2;
  bp.frequency.setValueAtTime(300,now);bp.frequency.exponentialRampToValueAtTime(3200,now+.6);
  const g=ac.createGain();g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(.09,now+.15);g.gain.linearRampToValueAtTime(0,now+.75);
  src.connect(bp);bp.connect(g);g.connect(master);src.start(now);
}
const soundBtn=document.getElementById("sound");
function setSound(on){
  initAudio(); if(!ac) return;
  soundOn=on; ac.resume?.();
  master.gain.cancelScheduledValues(ac.currentTime);
  master.gain.linearRampToValueAtTime(on?.7:0,ac.currentTime+.4);
  soundBtn.setAttribute("aria-pressed",on);
  document.getElementById("soundIco").textContent=on?"🔊":"🔇";
  document.getElementById("soundTxt").textContent=on?"Sonido activado":"Activar sonido";
  if(on) pad(S[idx].chord);
}
soundBtn.addEventListener("click",e=>{e.stopPropagation();setSound(!soundOn)});

/* ---------- Reproductor ---------- */
const svg=document.getElementById("svg"),stage=document.getElementById("stage"),player=document.getElementById("player");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let idx=0,t=0,playing=!reduce,last=performance.now();
const blobP=document.getElementById("blobP"),blobR=document.getElementById("blobR");
function go(i){
  idx=Math.max(0,Math.min(S.length-1,i)); t=0; closeDetail(false);
  document.querySelectorAll(".scene").forEach(g=>g.classList.remove("on"));
  const g=document.getElementById("s"+idx); void g.getBoundingClientRect(); g.classList.add("on");
  const m=S[idx].mood; blobP.style.opacity=m==="r"?.25:1; blobR.style.opacity=m==="p"?.25:1;
  S[idx].enter?.(); whoosh(); pad(S[idx].chord); ui();
}
function fire(a,b){for(const bt of S[idx].beats||[]){if(bt.at>a&&bt.at<=b){if(bt.n!=null)pluck(bt.n);if(bt.whoosh)whoosh();bt.fn?.()}}}
function setPlaying(p){
  playing=p; stage.classList.toggle("paused",!p);
  p?svg.unpauseAnimations():svg.pauseAnimations();
  document.getElementById("playIco").innerHTML=p?'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>':'<path d="M7 4v16l13-8z"/>';
  document.getElementById("play").setAttribute("aria-label",p?"Pausar":"Reproducir");
}
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
function ui(){
  segFill.forEach((f,i)=>f.style.width=i<idx?"100%":i>idx?"0%":(Math.min(1,t/S[idx].dur)*100)+"%");
  const done=S.slice(0,idx).reduce((a,s)=>a+s.dur,0)+t;
  document.getElementById("time").textContent=`${fmt(done)} / ${fmt(total)}`;
  document.getElementById("chap").textContent=`${idx+1}/${S.length} · ${S[idx].name}`;
}
function tick(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  if(playing){const a=t;t+=dt;fire(a,t);
    if(t>=S[idx].dur){if(idx<S.length-1)go(idx+1);else{t=S[idx].dur;setPlaying(false)}}
    ui();}
  requestAnimationFrame(tick);
}
document.getElementById("play").onclick=()=>{if(!playing&&idx===S.length-1&&t>=S[idx].dur)go(0);setPlaying(!playing)};
document.getElementById("prev").onclick=()=>{go(t>1.5?idx:idx-1);setPlaying(true)};
document.getElementById("next").onclick=()=>{go(idx+1);setPlaying(true)};
segs.addEventListener("click",e=>{const b=e.target.closest(".seg");if(b){go(+b.dataset.i);setPlaying(true)}});
document.getElementById("fs").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():player.requestFullscreen?.().catch(()=>{})}catch(_){}}

/* ---------- Interacción dentro del vídeo ---------- */
const detail=document.getElementById("detail");let resume=false;
function openDetail(c,n){
  const C=c==="P"?PRO:FOU,w=C.weeks[n-1];
  const col=c==="P"?"var(--pur-l)":"var(--red-l)";
  const tag=document.getElementById("dTag");tag.textContent=`${C.name} · Semana ${n}`;tag.style.color=col;
  document.getElementById("dTitle").textContent=w.t;
  document.getElementById("dLead").textContent=w.l;
  const ul=document.getElementById("dKeeps");ul.style.color=col;ul.innerHTML=w.k.map(k=>`<li><span style="color:var(--fg)">${esc(k)}</span></li>`).join("");
  document.getElementById("dDeel").hidden=!DEEL[c].includes(n);
  if(detail.hidden)resume=playing; detail.hidden=false; setPlaying(false); pluck(n+2);
  if(c==="F"&&idx===4)setCap(n);
}
function closeDetail(res=true){if(detail.hidden)return;detail.hidden=true;if(res&&resume)setPlaying(true)}
document.getElementById("dx").onclick=e=>{e.stopPropagation();closeDetail()};
function activate(el){
  if(el.dataset.go){go(+el.dataset.go);setPlaying(true);return}
  if(el.id==="replay"){go(0);setPlaying(true);return}
  if(el.dataset.c)openDetail(el.dataset.c,+el.dataset.n);
}
svg.addEventListener("click",e=>{
  const el=e.target.closest(".hit");
  if(el&&el.tagName.toLowerCase()==="a")return;
  if(el){activate(el);return}
  if(!detail.hidden){closeDetail();return}
  setPlaying(!playing);
});
svg.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.closest?.(".hit")){e.preventDefault();e.stopPropagation();activate(e.target.closest(".hit"))}});
document.addEventListener("keydown",e=>{
  if(e.target.closest?.(".hit")&&(e.key===" "||e.key==="Enter"))return;
  if(e.key===" "){e.preventDefault();setPlaying(!playing)}
  else if(e.key==="ArrowRight"){go(idx+1);setPlaying(true)}
  else if(e.key==="ArrowLeft"){go(idx-1);setPlaying(true)}
  else if(e.key==="m"||e.key==="M")setSound(!soundOn)
  else if(e.key==="Escape")closeDetail()
  else if(e.key==="f"||e.key==="F")document.getElementById("fs").click();
});

go(0); setPlaying(playing); requestAnimationFrame(tick);
})();
</script>
